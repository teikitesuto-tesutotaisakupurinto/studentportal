<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
運営管理画面
</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body>


<div class="layout">



<aside class="sidebar">


<div class="logo">

運営管理

</div>



<nav>


<button onclick="showAdminPage('dashboard')">
ダッシュボード
</button>


<button onclick="showAdminPage('notice')">
お知らせ管理
</button>


<button onclick="showAdminPage('messages')">
連絡管理
</button>


<button onclick="showAdminPage('documents')">
配布文書管理
</button>


<button onclick="showAdminPage('calendar')">
カレンダー管理
</button>


<button onclick="showAdminPage('scores')">
テスト成績管理
</button>


<button onclick="showAdminPage('users')">
生徒管理
</button>


<hr>


<button onclick="logout()">
ログアウト
</button>


</nav>


</aside>






<main class="content">





<section id="dashboard" style="display:block;">


<h1>
ダッシュボード
</h1>


<div class="card">

運営管理画面

</div>


</section>








<section id="notice">


<h1>
お知らせ作成
</h1>



<label>
タイトル
</label>


<input id="noticeTitle">





<label>
本文
</label>


<textarea id="noticeBody"></textarea>






<label>
重要タグ
</label>


<select id="importance">


<option value="normal">
通常
</option>


<option value="important">
重要
</option>


</select>






<label>
公開開始日
</label>


<input
id="startDate"
type="date">





<label>
公開終了日
</label>


<input
id="endDate"
type="date">







<label>
送信範囲
</label>


<select
id="targetType"
onchange="changeTarget()">



<option value="">
選択してください
</option>


<option value="all">
全生徒
</option>


<option value="block">
ブロック
</option>


<option value="block_grade">
ブロック＋学年
</option>


<option value="individual">
個別
</option>


</select>








<div id="blockArea" style="display:none;">


<label>
ブロック
</label>


<select id="block">

<option>
読み込み中...
</option>


</select>


</div>








<div id="gradeArea" style="display:none;">


<label>
学年
</label>


<select id="grade">


<option>
中学1年
</option>


<option>
中学2年
</option>


<option>
中学3年
</option>


</select>


</div>








<div id="userArea" style="display:none;">


<label>
対象生徒ID
</label>


<input id="targetUid">


</div>






<button onclick="createNotice()">

公開

</button>


</section>









<section id="messages">


<h1>
連絡管理
</h1>


<div id="messageList">

</div>


</section>









<section id="documents">


<h1>
配布文書管理
</h1>



<label>
資料名
</label>


<input
id="documentTitle"
placeholder="資料名">





<label>
PDFファイル
</label>


<input
type="file"
id="documentFile"
accept=".pdf">





<button onclick="addDocument()">

アップロード

</button>


</section>









<section id="calendar">


<h1>
カレンダー管理
</h1>




<input
id="calendarTitle"
placeholder="予定名">





<input
id="calendarDate"
type="date">





<textarea
id="calendarDescription"
placeholder="予定内容">
</textarea>





<button onclick="addCalendar()">

登録

</button>


</section>









<section id="scores">


<h1>
テスト成績管理
</h1>


<div id="scoreList">

</div>


</section>









<section id="users">


<h1>
生徒管理
</h1>


<div id="userList">

</div>


</section>







</main>


</div>






<script type="module" src="js/auth.js"></script>

<script type="module" src="js/admin.js"></script>



</body>

</html>
