  rel="stylesheet"
>

</head>


<body>

<div class="layout">


<aside class="sidebar">

  <div class="logo">
    定期テスト対策ポータル<br>
    管理画面
  </div>


  <nav>

    <a href="../dashboard/admin.html">

      <span class="material-symbols-rounded">
        home
      </span>

      <span>ダッシュボード</span>

    </a>


    <a href="../information/admin.html">

      <span class="material-symbols-rounded">
        campaign
      </span>

      <span>お知らせ管理</span>

    </a>


    <a href="../messages/admin.html">

      <span class="material-symbols-rounded">
        mail
      </span>

      <span>連絡管理</span>

    </a>


    <a href="../documents/admin.html">

      <span class="material-symbols-rounded">
        description
      </span>

      <span>配布文書管理</span>

    </a>


    <a href="../calendar/admin.html">

      <span class="material-symbols-rounded">
        calendar_month
      </span>

      <span>カレンダー管理</span>

    </a>


    <a href="../scoreForms/admin.html">

      <span class="material-symbols-rounded">
        edit_note
      </span>

      <span>成績フォーム作成</span>

    </a>


    <a
      href="../scores/admin.html"
      class="active"
    >

      <span class="material-symbols-rounded">
        analytics
      </span>

      <span>成績分析</span>

    </a>


    <a href="../users/admin.html">

      <span class="material-symbols-rounded">
        group
      </span>

      <span>生徒管理</span>

    </a>


    <hr>


    <button
      type="button"
      onclick="logout()"
    >

      <span class="material-symbols-rounded">
        logout
      </span>

      <span>ログアウト</span>

    </button>

  </nav>

</aside>


<main class="content">

<section>


<h1>成績分析</h1>


<div class="card">

  <h2>
    テストを選択
  </h2>

  <p>
    分析するテストを選択してください。
  </p>


  <label for="testSelect">
    テスト
  </label>


  <select id="testSelect">

    <option value="">
      テストを読み込んでいます...
    </option>

  </select>

</div>


<div id="selectedTestArea"></div>


<div id="analysisArea">

  <div class="card">

    <p>
      テストを選択すると、
      成績分析結果が表示されます。
    </p>

  </div>

</div>


<div class="card">

  <h2>
    提出・再回答管理
  </h2>

  <div id="scoreSubmissionList">

    テストを選択すると、
    そのテストの提出状況が表示されます。

  </div>

</div>


</section>

</main>

</div>


<script
  type="module"
  src="../js/auth.js"
></script>

<script
  type="module"
  src="../js/admin.js"
></script>

<script type="module">

import {
  loadScoreAnalysis
} from "../js/scoreAnalysis.js";


window.addEventListener(
  "load",
  () => {

    loadScoreAnalysis();

  }
);

</script>
