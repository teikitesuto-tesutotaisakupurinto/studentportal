```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>成績分析</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="layout">

<aside class="sidebar admin-sidebar">

<div class="logo">
定期テスト対策ポータル<br>
管理画面
</div>

<nav>
<a href="../dashboard/admin.html">ダッシュボード</a>
<a href="../information/admin.html">お知らせ管理</a>
<a href="../messages/admin.html">連絡管理</a>
<a href="../documents/admin.html">配布文書管理</a>
<a href="../calendar/admin.html">カレンダー管理</a>
<a href="../scoreForms/admin.html">成績フォーム作成</a>
<a href="../scores/admin.html">成績分析</a>
<a href="../users/admin.html">生徒管理</a>
<hr>
<button type="button" onclick="logout()">ログアウト</button>
</nav>

</aside>

<main class="content">

<section>

<h1>成績分析</h1>

<!-- テスト選択 -->
<div class="card">

<h2>テストを選択</h2>

<p>
分析したいテストを選択してください。
</p>

<label for="testSelect">テスト</label>

<select id="testSelect">
<option value="">テストを読み込み中...</option>
</select>

</div>

<!-- 選択中のテスト -->
<div id="selectedTestArea"></div>

<!-- 成績分析 -->
<div id="analysisArea">

<div class="card">
<p>テストを選択すると、成績分析結果が表示されます。</p>
</div>

</div>

<!-- 提出・再回答管理 -->
<div class="card">

<h2>提出・再回答管理</h2>

<div id="scoreSubmissionList">
テストを選択すると、提出状況を表示します。
</div>

</div>

</section>

</main>
</div>

<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/admin.js"></script>

<script type="module">

import {
  loadScoreAnalysis,
  loadTestList,
  changeAnalysisTest
} from "../js/scoreAnalysis.js";

window.addEventListener("load", async () => {

  try {

    const testSelect = document.getElementById("testSelect");

    await loadTestList();

    testSelect.addEventListener("change", async () => {

      const testId = testSelect.value;

      if(!testId){
        document.getElementById("analysisArea").innerHTML = `
          <div class="card">
            <p>テストを選択すると、成績分析結果が表示されます。</p>
          </div>
        `;

        document.getElementById("selectedTestArea").innerHTML = "";

        document.getElementById("scoreSubmissionList").innerHTML =
          "テストを選択すると、提出状況を表示します。";

        return;
      }

      await changeAnalysisTest(testId);

    });

  } catch(error) {

    console.error(error);

    document.getElementById("analysisArea").innerHTML = `
      <div class="card">
        <p class="error">
          成績分析の読み込みに失敗しました。
        </p>
      </div>
    `;

  }

});

</script>

</body>
</html>
```
