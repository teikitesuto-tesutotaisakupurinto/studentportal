</nav>

</aside>

<main class="content">

<header class="page-header">

<h1>
配布文書管理
</h1>

</header>

<section>

<div class="card">

<h2>
配布文書を登録
</h2>

<label>
題名
</label>

<input
id="documentTitle"
type="text">


<label>
文
</label>

<textarea
id="documentBody"></textarea>


<label>
配布文書URL
</label>

<input
id="documentUrl"
type="url"
placeholder="PDF等のURL">


<label>
公開開始日
</label>

<input
id="documentStartDate"
type="date">


<label>
公開終了日
</label>

<input
id="documentEndDate"
type="date">


<label>
配信範囲
</label>

<select
id="documentTargetType"
onchange="changeDocumentTarget()">

<option value="all">
全生徒
</option>

<option value="block">
ブロック一斉送信
</option>

<option value="grade">
学年一斉送信
</option>

<option value="block_grade">
ブロック＋学年
</option>

<option value="individual">
個別送信
</option>

</select>


<div
id="documentBlockArea"
style="display:none">

<label>
ブロック
</label>

<select id="documentBlock">
</select>

</div>


<div
id="documentGradeArea"
style="display:none">

<label>
学年
</label>

<select id="documentGrade">

<option>
中学1年
</option>

<option>
中学2年
</option>

<option>
中学3年
</option>

</select>

</div>


<div
id="documentUserArea"
style="display:none">

<label>
生徒
</label>

<select id="documentUser">
</select>

</div>


<button
type="button"
onclick="addDocument()">

登録

</button>

</div>


<div class="card">

<h2>
登録済み配布文書
</h2>

<div id="documentList"></div>

</div>

</section>

</main>

</div>

<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/admin.js"></script>

</body>
</html>
