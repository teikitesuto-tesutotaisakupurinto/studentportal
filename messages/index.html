
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <title>連絡 | 定期テスト対策プリント運営事務局</title>
  <link rel="stylesheet" href="../css/style.css">

  <style>
    .msg-page { max-width: 1100px; margin: auto; }
    .msg-header {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 12px;
      margin-bottom: 22px;
    }
    .msg-header h1 { margin: 0 0 6px; }
    .msg-muted { color: #64748b; font-size: .9rem; }
    .msg-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      gap: 18px; align-items: start;
    }
    .msg-panel {
      min-width: 0; padding: 20px; background: white;
      border: 1px solid #e2e8f0; border-radius: 14px;
      box-shadow: 0 2px 8px rgb(15 23 42 / 4%);
    }
    .msg-panel h2 { margin: 0 0 16px; font-size: 1.15rem; }
    .msg-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .msg-button, .msg-tab {
      padding: 10px 14px; border: 0; border-radius: 9px;
      background: #1d4ed8; color: white; font: inherit; cursor: pointer;
    }
    .msg-button:disabled { opacity: .6; cursor: wait; }
    .msg-button.secondary, .msg-tab {
      background: #e2e8f0; color: #0f172a;
    }
    .msg-tab.active { background: #dbeafe; color: #1d4ed8; font-weight: 700; }
    .msg-list { display: grid; gap: 9px; max-height: 520px; overflow: auto; }
    .msg-item {
      width: 100%; padding: 13px; border: 1px solid #e2e8f0;
      border-radius: 10px; background: white; text-align: left;
      font: inherit; cursor: pointer; overflow-wrap: anywhere;
    }
    .msg-item:hover, .msg-item.selected { background: #eff6ff; border-color: #2563eb; }
    .msg-item strong { display: block; margin-bottom: 6px; }
    .msg-item small { display: block; color: #64748b; margin-bottom: 7px; }
    .msg-status {
      padding: 13px; border-radius: 9px;
      background: #f8fafc; color: #64748b; line-height: 1.7;
    }
    .msg-status.error { background: #fef2f2; color: #b91c1c; }
    .msg-status.success { background: #ecfdf5; color: #047857; }
    .msg-detail-body {
      padding: 15px; min-height: 100px; border-radius: 9px;
      background: #f8fafc; white-space: pre-wrap;
      overflow-wrap: anywhere; line-height: 1.8;
    }
    .msg-form { display: grid; gap: 13px; margin-top: 22px; }
    .msg-form label { display: grid; gap: 6px; font-size: .9rem; }
    .msg-form input, .msg-form textarea {
      width: 100%; box-sizing: border-box; padding: 11px;
      border: 1px solid #cbd5e1; border-radius: 9px;
      font: inherit; background: white; color: #0f172a;
    }
    .msg-form textarea { min-height: 130px; resize: vertical; }
    .msg-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 780px) {
      .msg-layout { grid-template-columns: 1fr; }
      .msg-panel { padding: 15px; }
      .msg-list { max-height: 330px; }
    }
  </style>
</head>

<body>
  <div id="portalRoot">
    <main class="msg-page">
      <header class="msg-header">
        <div>
          <h1>メッセージ</h1>
          <p class="msg-muted">送受信メッセージを管理します。</p>
        </div>
        <button id="refreshButton" class="msg-button" type="button">
          再読み込み
        </button>
      </header>

      <div class="msg-layout">
        <section class="msg-panel">
          <h2>メッセージ一覧</h2>

          <div class="msg-tabs">
            <button id="inboxTab" class="msg-tab active" type="button">
              受信
            </button>
            <button id="sentTab" class="msg-tab" type="button">
              送信
            </button>
          </div>

          <p id="count" class="msg-muted"></p>
          <div id="listStatus" class="msg-status" role="status">
            読み込み中…
          </div>
          <div id="messageList" class="msg-list"></div>
        </section>

        <section class="msg-panel">
          <h2>メッセージ詳細</h2>
          <div id="messageDetail" class="msg-status">
            一覧からメッセージを選択してください。
          </div>

          <form id="messageForm" class="msg-form">
            <h2>新規メッセージ</h2>

            <label>
              送信先のユーザーUID
              <input
                id="recipientId"
                required
                maxlength="128"
                autocomplete="off"
                placeholder="相手のFirebase UID"
              >
            </label>

            <p class="msg-muted">
              相手のUIDは管理者などから確認してください。
              メールアドレスだけでは送信先を特定できません。
            </p>

            <label>
              件名
              <input id="subject" required maxlength="200" placeholder="件名">
            </label>

            <label>
              本文
              <textarea id="body" required maxlength="10000"
                placeholder="メッセージを入力してください"></textarea>
            </label>

            <div id="composeStatus" class="msg-status" role="status" hidden></div>

            <div class="msg-actions">
              <button id="sendButton" class="msg-button" type="submit">
                送信する
              </button>
              <button id="clearButton" class="msg-button secondary" type="button">
                クリア
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script type="module">
    import {
      auth, db, doc, getDoc, collection, getDocs,
      addDoc, query, where, onAuthStateChanged, serverTimestamp
    } from "../js/firebase.js";

    import {
      protectPage, renderPortalShell
    } from "../js/portal.js";

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let currentRole = "student";
    let view = "inbox";
    let messages = [];
    let selectedId = null;
    let loading = false;
    let initialized = false;

    function status(element, message, type = "") {
      element.textContent = message;
      element.hidden = false;
      element.classList.remove("error", "success");
      if (type) element.classList.add(type);
    }

    function formatDate(value) {
      if (!value) return "日時未設定";
      const date = typeof value.toDate === "function"
        ? value.toDate()
        : new Date(value);

      if (Number.isNaN(date.getTime())) return "日時未設定";

      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit"
      }).format(date);
    }

    function visibleMessages() {
      return messages
        .filter(m => view === "inbox"
          ? m.recipientId === currentUser.uid
          : m.senderId === currentUser.uid)
        .sort((a, b) => {
          const ta = a.createdAt?.toMillis?.() || 0;
          const tb = b.createdAt?.toMillis?.() || 0;
          return tb - ta;
        });
    }

    function renderDetail(message) {
      const container = $("messageDetail");
      container.replaceChildren();

      const title = document.createElement("h3");
      title.textContent = message.subject || "件名なし";

      const meta = document.createElement("p");
      meta.className = "msg-muted";
      meta.textContent =
        `差出人UID: ${message.senderId}\n` +
        `宛先UID: ${message.recipientId}\n` +
        `日時: ${formatDate(message.createdAt)}`;
      meta.style.whiteSpace = "pre-line";

      const body = document.createElement("div");
      body.className = "msg-detail-body";
      body.textContent = message.body || "";

      container.append(title, meta, body);

      if (message.senderId !== currentUser.uid) {
        const reply = document.createElement("button");
        reply.type = "button";
        reply.className = "msg-button";
        reply.textContent = "この相手に返信";
        reply.style.marginTop = "12px";

        reply.addEventListener("click", () => {
          $("recipientId").value = message.senderId;
          $("subject").value = message.subject
            ? "Re: " + message.subject.replace(/^Re:\s*/i, "")
            : "";
          $("body").focus();
        });

        container.append(reply);
      }
    }

    function renderList() {
      const list = $("messageList");
      const statusElement = $("listStatus");
      const items = visibleMessages();

      list.replaceChildren();
      $("count").textContent = `${items.length}件`;

      if (!items.length) {
        status(statusElement,
          view === "inbox" ? "受信メッセージはありません。" : "送信メッセージはありません。");
        $("messageDetail").textContent = "表示できるメッセージがありません。";
        selectedId = null;
        return;
      }

      statusElement.hidden = true;

      for (const message of items) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "msg-item";

        if (message.id === selectedId) button.classList.add("selected");

        const title = document.createElement("strong");
        title.textContent = message.subject || "件名なし";

        const meta = document.createElement("small");
        const otherUid = view === "inbox"
          ? message.senderId
          : message.recipientId;

        meta.textContent =
          `${view === "inbox" ? "差出人" : "宛先"}: ${otherUid} · ${formatDate(message.createdAt)}`;

        const preview = document.createElement("span");
        preview.textContent = (message.body || "").slice(0, 100);

        button.append(title, meta, preview);
        button.addEventListener("click", () => {
          selectedId = message.id;
          renderList();
          renderDetail(message);
        });

        list.append(button);
      }

      const selected = items.find(m => m.id === selectedId) || items[0];
      selectedId = selected.id;
      renderDetail(selected);
    }

    async function fetchMessages() {
      if (loading) return;
      loading = true;
      $("refreshButton").disabled = true;
      status($("listStatus"), "メッセージを取得しています。");

      try {
        const messagesRef = collection(db, "messages");
        let snapshots = [];

        if (currentRole === "admin") {
          // 管理者はルールで許可された全件を取得できる。
          snapshots = [await getDocs(messagesRef)];
        } else {
          // 生徒は受信・送信それぞれを条件付きで取得する。
          const [received, sent] = await Promise.all([
            getDocs(query(
              messagesRef,
              where("recipientId", "==", currentUser.uid)
            )),
            getDocs(query(
              messagesRef,
              where("senderId", "==", currentUser.uid)
            ))
          ]);

          snapshots = [received, sent];
        }

        const unique = new Map();

        for (const snapshot of snapshots) {
          for (const item of snapshot.docs) {
            const data = item.data();

            unique.set(item.id, {
              id: item.id,
              senderId: data.senderId || "",
              recipientId: data.recipientId || "",
              subject: data.subject || data.title || "件名なし",
              body: data.body || data.message || data.content || "",
              createdAt: data.createdAt || null
            });
          }
        }

        messages = [...unique.values()];
        selectedId = null;
        renderList();
      } catch (error) {
        console.error("メッセージ取得エラー:", error);
        $("messageList").replaceChildren();

        status(
          $("listStatus"),
          error.code === "permission-denied"
            ? "アクセスが拒否されました。Firestore Security Rulesとユーザー権限を確認してください。"
            : "メッセージを取得できませんでした。通信状況を確認してください。",
          "error"
        );
      } finally {
        loading = false;
        $("refreshButton").disabled = false;
      }
    }

    async function sendMessage(event) {
      event.preventDefault();

      const recipientId = $("recipientId").value.trim();
      const subject = $("subject").value.trim();
      const body = $("body").value.trim();

      if (!recipientId || !subject || !body) {
        status($("composeStatus"), "宛先・件名・本文を入力してください。", "error");
        return;
      }

      if (recipientId === currentUser.uid) {
        status($("composeStatus"), "自分自身には送信できません。", "error");
        return;
      }

      if (body.length > 10000 || subject.length > 200) {
        status($("composeStatus"), "件名または本文が長すぎます。", "error");
        return;
      }

      $("sendButton").disabled = true;
      status($("composeStatus"), "送信しています。");

      try {
        await addDoc(collection(db, "messages"), {
          senderId: currentUser.uid,
          recipientId,
          subject,
          body,
          createdAt: serverTimestamp()
        });

        status($("composeStatus"), "メッセージを送信しました。", "success");
        $("subject").value = "";
        $("body").value = "";

        view = "sent";
        updateTabs();
        await fetchMessages();
      } catch (error) {
        console.error("メッセージ送信エラー:", error);

        status(
          $("composeStatus"),
          error.code === "permission-denied"
            ? "送信できません。送信先UIDが存在するか、Security Rulesを確認してください。"
            : "送信に失敗しました。通信状況を確認してください。",
          "error"
        );
      } finally {
        $("sendButton").disabled = false;
      }
    }

    function updateTabs() {
      $("inboxTab").classList.toggle("active", view === "inbox");
      $("sentTab").classList.toggle("active", view === "sent");
      selectedId = null;
      renderList();
    }

    $("inboxTab").addEventListener("click", () => {
      view = "inbox";
      updateTabs();
    });

    $("sentTab").addEventListener("click", () => {
      view = "sent";
      updateTabs();
    });

    $("refreshButton").addEventListener("click", fetchMessages);
    $("messageForm").addEventListener("submit", sendMessage);

    $("clearButton").addEventListener("click", () => {
      $("messageForm").reset();
      $("composeStatus").hidden = true;
    });

    async function startPage() {
      if (initialized) return;
      initialized = true;

      const user = await new Promise((resolve, reject) => {
        const unsubscribe = onAuthStateChanged(
          auth,
          value => {
            unsubscribe();
            resolve(value);
          },
          error => {
            unsubscribe();
            reject(error);
          }
        );
      });

      if (!user) {
        window.location.replace("../login.html");
        return;
      }

      currentUser = user;

      const profile = await getDoc(doc(db, "users", user.uid));
      currentRole = profile.exists() && profile.data().role === "admin"
        ? "admin"
        : "student";

      await protectPage("login");

      renderPortalShell({
        title: "メッセージ",
        activePage: "messages"
      });

      await fetchMessages();
    }

    startPage().catch(error => {
      console.error("ページ初期化エラー:", error);
      status($("listStatus"), "ページを初期化できませんでした。Firebase設定を確認してください。", "error");
    });
  </script>
</body>
</html>
