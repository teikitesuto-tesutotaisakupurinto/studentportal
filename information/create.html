<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>定期テスト対策プリント運営事務局|ポータルサイト</title>

<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..1,0..200">
</head>

<body data-role="admin">

<aside id="sidebar" class="sidebar"></aside>

<main class="content">
<div class="content-inner">

<h1 class="page-title">お知らせを作成</h1>

<div id="createStatus"></div>

<div class="card">

<div class="form-group">
<label>タイトル</label>
<input id="noticeTitle" type="text">
</div>

<div class="form-group">
<label>本文</label>
<textarea id="noticeBody"></textarea>
</div>

<div class="form-group">
<label>重要度</label>

<select id="importance">
<option value="normal">通常</option>
<option value="important">重要</option>
</select>

</div>

<div class="form-group">
<label>公開開始日</label>
<input id="startDate" type="date">
</div>

<div class="form-group">
<label>公開終了日</label>
<input id="endDate" type="date">
</div>

<div class="form-group">

<label>配信区分</label>

<select id="targetType">

<option value="all">
全員
</option>

<option value="block">
ブロック一斉送信
</option>

<option value="block_grade">
ブロック＋学年
</option>

<option value="grade">
学年一斉送信
</option>

<option value="individual">
個別送信
</option>

</select>

</div>

<div id="targetDetail" class="target-detail"></div>

<button
type="button"
id="createNoticeButton"
class="primary-button">

<span class="material-symbols-rounded">
send
</span>

送信

</button>

<a
href="../information/admin.html"
class="secondary-button">

戻る

</a>

</div>

</div>
</main>

<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/menu.js"></script>
<script type="module" src="../js/admin.js"></script>

</body>
</html>
