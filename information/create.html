<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>定期テスト対策プリント運営事務局|ポータルサイト</title>

<link rel="icon" href="../favicon.svg" type="image/svg+xml">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="layout">

<aside class="sidebar" id="sidebar">

<div class="sidebar-header">

<div class="sidebar-logo">

<span class="material-symbols-outlined">
school
</span>

<span class="sidebar-title">
定期テスト対策プリント運営事務局
</span>

</div>

<button
class="menu-toggle"
onclick="toggleSidebar()">

<span class="material-symbols-outlined">
menu
</span>

</button>

</div>

<nav class="sidebar-nav">

<a href="../dashboard/admin.html" class="menu-item">
<span class="material-symbols-outlined">dashboard</span>
<span class="menu-text">ダッシュボード</span>
</a>

<a href="admin.html" class="menu-item active">
<span class="material-symbols-outlined">campaign</span>
<span class="menu-text">お知らせ管理</span>
</a>

<a href="../messages/admin.html" class="menu-item">
<span class="material-symbols-outlined">mail</span>
<span class="menu-text">連絡管理</span>
</a>

<a href="../documents/admin.html" class="menu-item">
<span class="material-symbols-outlined">description</span>
<span class="menu-text">配布文書管理</span>
</a>

<a href="../calendar/admin.html" class="menu-item">
<span class="material-symbols-outlined">calendar_month</span>
<span class="menu-text">カレンダー管理</span>
</a>

<a href="../scoreForms/admin.html" class="menu-item">
<span class="material-symbols-outlined">assignment</span>
<span class="menu-text">成績フォーム作成</span>
</a>

<a href="../scores/admin.html" class="menu-item">
<span class="material-symbols-outlined">analytics</span>
<span class="menu-text">成績分析</span>
</a>

<a href="../users/admin.html" class="menu-item">
<span class="material-symbols-outlined">group</span>
<span class="menu-text">生徒管理</span>
</a>

</nav>

</aside>

<main class="content">

<header class="page-header">

<h1>
お知らせを作成
</h1>

</header>

<section>

<div class="card">

<label>
タイトル
</label>

<input
id="noticeTitle"
type="text"
placeholder="お知らせのタイトル">


<label>
本文（任意）
</label>

<textarea
id="noticeBody"
placeholder="本文を入力してください"></textarea>


<label>
重要度
</label>

<select id="importance">

<option value="normal">
通常
</option>

<option value="important">
重要
</option>

</select>


<label>
公開開始日
</label>

<input
id="startDate"
type="date">


<label>
公開終了日
</label>

<input
id="endDate"
type="date">


<label>
配信範囲
</label>

<select
id="targetType"
onchange="changeTarget()">

<option value="all">
全生徒
</option>

<option value="block">
ブロック一斉送信
</option>

<option value="grade">
学年一斉送信
</option>

<option value="block_grade">
ブロック＋学年
</option>

<option value="individual">
個別送信
</option>

</select>


<div
id="blockArea"
style="display:none">

<label>
ブロック
</label>

<select id="block">
</select>

</div>


<div
id="gradeArea"
style="display:none">

<label>
学年
</label>

<select id="grade">

<option value="">
選択してください
</option>

<option>
中学1年
</option>

<option>
中学2年
</option>

<option>
中学3年
</option>

</select>

</div>


<div
id="userArea"
style="display:none">

<label>
生徒
</label>

<select id="targetUser">
</select>

</div>


<div class="form-actions">

<a
href="admin.html"
class="secondary-button">

戻る

</a>

<button
type="button"
onclick="createNotice()">

送信

</button>

</div>

</div>

</section>

</main>

</div>

<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/admin.js"></script>

</body>
</html>
