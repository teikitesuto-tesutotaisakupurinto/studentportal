<script>

const sidebar =
  document.getElementById(
    "sidebar"
  );

const content =
  document.querySelector(
    ".content"
  );

const toggle =
  document.getElementById(
    "sidebarToggle"
  );


const savedState =
  localStorage.getItem(
    "portalSidebarCollapsed"
  );


function setSidebarState(
  collapsed
){

  sidebar.classList.toggle(
    "collapsed",
    collapsed
  );

  content.classList.toggle(
    "sidebar-collapsed",
    collapsed
  );

  toggle.classList.toggle(
    "collapsed",
    collapsed
  );

}


setSidebarState(
  savedState === "true"
);


toggle.addEventListener(
  "click",
  () => {

    const collapsed =
      !sidebar.classList.contains(
        "collapsed"
      );

    setSidebarState(
      collapsed
    );

    localStorage.setItem(
      "portalSidebarCollapsed",
      String(collapsed)
    );

  }
);

</script>
