<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>お知らせ管理</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="layout">

<aside class="sidebar admin-sidebar">

<div class="logo">
定期テスト対策ポータル<br>
管理画面
</div>

<nav>
<a href="../dashboard/admin.html">ダッシュボード</a>
<a href="../information/admin.html">お知らせ管理</a>
<a href="../messages/admin.html">連絡管理</a>
<a href="../documents/admin.html">配布文書管理</a>
<a href="../calendar/admin.html">カレンダー管理</a>
<a href="../scoreForms/admin.html">成績フォーム作成</a>
<a href="../scores/admin.html">成績分析</a>
<a href="../users/admin.html">生徒管理</a>
<hr>
<button onclick="logout()">ログアウト</button>
</nav>

</aside>

<main class="content">

<section>

<h1>お知らせ管理</h1>

<div id="noticeFormMessage"></div>

<div class="card">

<label>タイトル</label>
<input id="noticeTitle">

<label>本文</label>
<textarea id="noticeBody"></textarea>

<label>重要度</label>
<select id="importance">
<option value="normal">通常</option>
<option value="important">重要</option>
</select>

<label>公開開始日</label>
<input id="startDate" type="date">

<label>公開終了日</label>
<input id="endDate" type="date">

<label>配信範囲</label>

<select id="targetType" onchange="changeTarget()">
<option value="all">全生徒</option>
<option value="block">ブロック</option>
<option value="block_grade">ブロック＋学年</option>
<option value="individual">個別</option>
</select>

<div id="blockArea" style="display:none">
<label>ブロック</label>
<select id="block"></select>
</div>

<div id="gradeArea" style="display:none">
<label>学年</label>
<select id="grade">
<option>中学1年</option>
<option>中学2年</option>
<option>中学3年</option>
</select>
</div>

<div id="userArea" style="display:none">
<label>生徒</label>
<select id="targetUser"></select>
</div>

<button onclick="createNotice()">
公開
</button>

</div>

</section>

</main>
</div>

<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/admin.js"></script>

</body>
</html>
