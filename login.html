<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>
定期テスト対策プリント運営事務局|ポータルサイト
</title>

<link
  rel="stylesheet"
  href="./css/style.css"
>

<link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
  rel="stylesheet"
>

</head>

<body>

<div class="login-container">

  <main class="login-box">

    <img
      class="login-logo"
      src="./assets/logo.svg"
      alt="定期テスト対策プリント運営事務局"
    >

    <h1>
      ログイン
    </h1>

    <p class="login-site-name">
      定期テスト対策プリント運営事務局|ポータルサイト
    </p>

    <div
      id="loginError"
      class="login-error"
    ></div>

    <form id="loginForm">

      <label for="email">
        メールアドレス
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">
        パスワード
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
        class="login-submit"
      >
        <span class="material-symbols-rounded">
          login
        </span>

        <span>
          ログイン
        </span>
      </button>

    </form>

    <div class="login-divider">
      または
    </div>

    <button
      type="button"
      id="googleLoginButton"
      class="google-button"
    >

      <img
        class="google-logo"
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google"
      >

      <span>
        Googleでログイン
      </span>

    </button>

    <a
      href="#"
      id="forgotPassword"
      class="login-forgot"
    >
      パスワードを忘れた場合
    </a>

  </main>

</div>

<script type="module" src="./js/auth.js"></script>

</body>
</html>
