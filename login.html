
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ログイン | 定期テスト対策プリント運営事務局</title>

  <meta
    name="description"
    content="Student Portalのログインページ"
  >

  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter,
        "Noto Sans JP",
        "Yu Gothic UI",
        sans-serif;
      background: #f3f6fc;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(
          circle at top left,
          #dce9ff 0,
          transparent 38%
        ),
        #f3f6fc;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 36px;
      background: #fff;
      border: 1px solid #e5eaf3;
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(35, 57, 100, .10);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 15px;
      color: white;
      background: #315efb;
      font-size: 23px;
      font-weight: 800;
    }

    .brand-name {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .brand-subtitle {
      margin: 4px 0 0;
      color: #748097;
      font-size: 12px;
    }

    h1 {
      margin: 0 0 9px;
      font-size: 27px;
      letter-spacing: -.8px;
    }

    .description {
      margin: 0 0 27px;
      color: #69758b;
      font-size: 14px;
      line-height: 1.8;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #dce2ed;
      border-radius: 11px;
      outline: none;
      background: #fff;
      color: #172033;
      font: inherit;
      font-size: 14px;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #315efb;
      box-shadow: 0 0 0 3px rgba(49, 94, 251, .12);
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      transition: background .15s, transform .15s;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #93b4ff;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .primary-button {
      margin-top: 5px;
      color: white;
      background: #315efb;
    }

    .primary-button:hover:not(:disabled) {
      background: #244bd6;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      color: #929bad;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e8ebf2;
    }

    .google-button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: 1px solid #dce2ed;
      color: #263249;
      background: #fff;
    }

    .google-button:hover:not(:disabled) {
      background: #f7f9fc;
    }

    .google-g {
      font-size: 19px;
      font-weight: 800;
      color: #4285f4;
    }

    .links {
      display: flex;
      justify-content: center;
      margin-top: 23px;
      font-size: 13px;
    }

    a {
      color: #315efb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .message {
      padding: 12px 14px;
      margin-bottom: 17px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .error-message {
      border: 1px solid #fecaca;
      color: #b42318;
      background: #fff1f0;
    }

    .success-message {
      border: 1px solid #bbf7d0;
      color: #166534;
      background: #f0fdf4;
    }

    .status-message {
      min-height: 20px;
      margin: 12px 0 0;
      color: #667085;
      text-align: center;
      font-size: 12px;
    }

    .footer {
      margin-top: 26px;
      color: #8993a5;
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 27px 22px;
        border-radius: 18px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">S</div>

      <div>
        <p class="brand-name">Student Portal</p>
        <p class="brand-subtitle">学習・学校情報ポータル</p>
      </div>
    </header>

    <h1>ログイン</h1>

    <p class="description">
      登録したアカウントでログインしてください。
    </p>

    <div
      id="loginError"
      class="message error-message"
      role="alert"
      aria-live="assertive"
      hidden
    ></div>

    <div
      id="loginSuccess"
      class="message success-message"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">メールアドレス</label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="example@example.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">パスワード</label>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="パスワードを入力"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        id="loginButton"
        class="primary-button"
        type="submit"
      >
        <span id="loginButtonText">ログイン</span>
      </button>
    </form>

    <p id="loginStatus" class="status-message" aria-live="polite"></p>

    <div class="divider">または</div>

    <button
      id="googleLoginButton"
      class="google-button"
      type="button"
    >
      <span class="google-g" aria-hidden="true">G</span>
      Googleアカウントでログイン
    </button>

    <div class="links">
      <a href="#" id="forgotPasswordLink">
        パスワードを忘れた場合
      </a>
    </div>

    <footer class="footer">
      Student Portal<br>
      安全なアカウント管理のため、パスワードを他人と共有しないでください。
    </footer>
  </main>

  <script type="module">
    import {
      auth,
      sendPasswordResetEmail
    } from "./js/firebase.js";

    import "./js/auth.js";

    const forgotPasswordLink =
      document.getElementById("forgotPasswordLink");

    const emailInput =
      document.getElementById("email");

    const errorElement =
      document.getElementById("loginError");

    const successElement =
      document.getElementById("loginSuccess");

    const statusElement =
      document.getElementById("loginStatus");

    function showError(message) {
      errorElement.textContent = message;
      errorElement.hidden = false;
      successElement.hidden = true;
      statusElement.textContent = "";
    }

    function showSuccess(message) {
      successElement.textContent = message;
      successElement.hidden = false;
      errorElement.hidden = true;
      statusElement.textContent = "";
    }

    forgotPasswordLink.addEventListener("click", async event => {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        emailInput.focus();
        showError(
          "先にメールアドレスを入力してください。"
        );
        return;
      }

      forgotPasswordLink.style.pointerEvents = "none";
      forgotPasswordLink.setAttribute("aria-disabled", "true");
      statusElement.textContent = "再設定メールを送信しています...";
      errorElement.hidden = true;
      successElement.hidden = true;

      try {
        await sendPasswordResetEmail(auth, email);

        showSuccess(
          "パスワード再設定メールを送信しました。メールを確認してください。"
        );
      } catch (error) {
        console.error("パスワード再設定エラー:", error);

        let message =
          "メールを送信できませんでした。入力内容とFirebaseの設定を確認してください。";

        if (error.code === "auth/invalid-email") {
          message = "メールアドレスの形式を確認してください。";
        } else if (
          error.code === "auth/network-request-failed"
        ) {
          message = "通信に失敗しました。ネットワークを確認してください。";
        } else if (
          error.code === "auth/too-many-requests"
        ) {
          message = "試行回数が多すぎます。しばらく待ってください。";
        }

        showError(message);
      } finally {
        forgotPasswordLink.style.pointerEvents = "";
        forgotPasswordLink.removeAttribute("aria-disabled");
      }
    });
  </script>
</body>
</html>
