<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>定期テスト対策プリント運営事務局|ポータルサイト</title>

<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0..200">
</head>

<body data-role="admin">

<aside id="sidebar" class="sidebar"></aside>

<main class="content">
<div class="content-inner">

<h1 class="page-title">カレンダー</h1>

<div id="calendarArea"></div>

<div class="card">

<h2>予定を追加</h2>

<div class="form-group">
<label>予定の題名</label>
<input id="calendarTitle">
</div>

<div class="form-group">
<label>開始日</label>
<input id="calendarStartDate" type="date">
</div>

<div class="form-group">
<label>終了日</label>
<input id="calendarEndDate" type="date">
</div>

<div class="form-group">
<label>内容</label>
<textarea id="calendarDescription"></textarea>
</div>

<button
id="addCalendarButton"
class="primary-button">

<span class="material-symbols-rounded">
add
</span>

予定を登録

</button>

</div>

<div id="eventDetail" class="event-detail"></div>

</div>
</main>

<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/menu.js"></script>
<script type="module" src="../js/admin.js"></script>

</body>
</html>
