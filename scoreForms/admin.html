<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>成績フォーム作成</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="layout">

<aside class="sidebar admin-sidebar">

<div class="logo">
定期テスト対策ポータル<br>
管理画面
</div>

<nav>
<a href="../dashboard/admin.html">ダッシュボード</a>
<a href="../information/admin.html">お知らせ管理</a>
<a href="../messages/admin.html">連絡管理</a>
<a href="../documents/admin.html">配布文書管理</a>
<a href="../calendar/admin.html">カレンダー管理</a>
<a href="../scoreForms/admin.html">成績フォーム作成</a>
<a href="../scores/admin.html">成績分析</a>
<a href="../users/admin.html">生徒管理</a>
<hr>
<button onclick="logout()">ログアウト</button>
</nav>

</aside>

<main class="content">

<section>

<h1>成績フォーム作成</h1>

<div class="card">

<label>フォーム名</label>
<input id="formTitle">

<label>テスト種類</label>
<select id="testType">
<option>中間テスト</option>
<option>期末テスト</option>
<option>その他</option>
</select>

<h3>科目</h3>

<div id="subjectList">

<label><input type="checkbox" value="国語"> 国語</label>
<label><input type="checkbox" value="数学"> 数学</label>
<label><input type="checkbox" value="英語"> 英語</label>
<label><input type="checkbox" value="理科"> 理科</label>
<label><input type="checkbox" value="社会"> 社会</label>
<label><input type="checkbox" value="音楽"> 音楽</label>
<label><input type="checkbox" value="美術"> 美術</label>
<label><input type="checkbox" value="保健体育"> 保健体育</label>
<label><input type="checkbox" value="技術家庭"> 技術家庭</label>

</div>

<label>公開開始日</label>
<input id="formStartDate" type="date">

<label>公開終了日</label>
<input id="formEndDate" type="date">

<label>公開範囲</label>

<select id="formTargetType" onchange="changeFormTarget()">
<option value="all">全生徒</option>
<option value="block">ブロック</option>
<option value="block_grade">ブロック＋学年</option>
<option value="individual">個別</option>
</select>

<div id="formBlockArea" style="display:none">
<label>ブロック</label>
<select id="formBlock"></select>
</div>

<div id="formGradeArea" style="display:none">
<label>学年</label>
<select id="formGrade">
<option>中学1年</option>
<option>中学2年</option>
<option>中学3年</option>
</select>
</div>

<div id="formUserArea" style="display:none">
<label>生徒</label>
<select id="formUser"></select>
</div>

<button onclick="createScoreForm()">
作成
</button>

</div>

</section>

</main>
</div>

<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/admin.js"></script>

</body>
</html>
