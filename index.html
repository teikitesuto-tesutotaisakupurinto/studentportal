<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>定期テスト対策プリント運営事務局|ポータルサイト</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

  <div class="login-box">

    <h1>定期テスト対策プリント運営事務局</h1>
    <p>ポータルサイトにログイン</p>

    <form id="loginForm">

      <label for="email">メールアドレス</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="メールアドレス"
        required
      >

      <label for="password">パスワード</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="パスワード"
        required
      >

      <button type="submit" class="primary-button">
        <span class="material-symbols-rounded">login</span>
        ログイン
      </button>

    </form>

    <div class="separator">
      <span>または</span>
    </div>

    <button id="googleLoginButton" type="button" class="google-btn">
      <span class="google-mark">G</span>
      Googleでログイン
    </button>

    <p id="loginError" class="error login-error"></p>

  </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
