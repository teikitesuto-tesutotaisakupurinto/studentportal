<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>
定期テスト対策プリント運営事務局|ポータルサイト
</title>

<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232563eb'/%3E%3Cpath d='M18 16h28v7H25v10h18v7H25v8h21v7H18z' fill='white'/%3E%3C/svg%3E"
>

<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
>

<link
  rel="stylesheet"
  href="css/style.css"
>

</head>

<body>

<div class="login-container">

<div class="login-box">

<h1>
定期テスト対策プリント<br>
運営事務局
</h1>

<p>
ポータルサイト
</p>

<form id="loginForm">

<label for="email">
メールアドレス
</label>

<input
  id="email"
  type="email"
  placeholder="メールアドレス"
  autocomplete="username"
  required
>

<label for="password">
パスワード
</label>

<input
  id="password"
  type="password"
  placeholder="パスワード"
  autocomplete="current-password"
  required
>

<button
  type="submit"
>
ログイン
</button>

</form>

<div
  id="loginError"
  class="error"
  style="margin-top:15px;"
></div>

<div class="separator">
<span>または</span>
</div>

<button
  type="button"
  id="googleLoginButton"
  class="google-btn"
>

<svg
  class="google-icon"
  viewBox="0 0 24 24"
  aria-hidden="true"
>

<path
  fill="#4285F4"
  d="M21.35 12.18c0-.78-.07-1.54-.22-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.92-4.18 2.92-7.4z"
/>

<path
  fill="#34A853"
  d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.74 9.74 0 0 0 12 21.5z"
/>

<path
  fill="#FBBC05"
  d="M6.54 13.59a5.86 5.86 0 0 1 0-3.18V7.89H3.3a9.75 9.75 0 0 0 0 8.22l3.24-2.52z"
/>

<path
  fill="#EA4335"
  d="M12 6.38c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.83 3.45 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.39l3.24 2.52C7.31 8.1 9.46 6.38 12 6.38z"
/>

</svg>

Googleでログイン

</button>

</div>

</div>

<script type="module">

import {
  loginEmail,
  loginGoogle,
  auth
} from "./js/auth.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


const loginForm =
  document.getElementById(
    "loginForm"
  );

const googleButton =
  document.getElementById(
    "googleLoginButton"
  );

const errorArea =
  document.getElementById(
    "loginError"
  );


/* 既にログイン済み */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      location.href =
        "dashboard/admin.html";
    }

  }
);


/* メールログイン */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    errorArea.textContent = "";

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    try{

      await loginEmail(
        email,
        password
      );

      location.href =
        "dashboard/admin.html";

    }catch(error){

      console.error(error);

      errorArea.textContent =
        "メールアドレスまたはパスワードが正しくありません。";
    }

  }
);


/* Googleログイン */

googleButton.addEventListener(
  "click",
  async () => {

    errorArea.textContent = "";

    googleButton.disabled = true;

    try{

      await loginGoogle();

      location.href =
        "dashboard/admin.html";

    }catch(error){

      console.error(error);

      if(
        error.code ===
        "auth/popup-closed-by-user"
      ){

        errorArea.textContent =
          "Googleログインがキャンセルされました。";

      }else if(
        error.code ===
        "auth/popup-blocked"
      ){

        errorArea.textContent =
          "ポップアップがブロックされています。ブラウザのポップアップ設定を確認してください。";

      }else if(
        error.code ===
        "auth/unauthorized-domain"
      ){

        errorArea.textContent =
          "このサイトのドメインがFirebase Authenticationで許可されていません。";

      }else{

        errorArea.textContent =
          "Googleログインに失敗しました。";

      }

    }finally{

      googleButton.disabled = false;

    }

  }
);

</script>

</body>
</html>
