<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>定期テスト対策ポータル</title>

<link rel="stylesheet" href="css/style.css">

<link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
  rel="stylesheet"
>

</head>


<body>

<div class="login-container">

  <div class="login-box">

    <div class="login-icon">
      <span class="material-symbols-rounded">
        school
      </span>
    </div>

    <h1>
      定期テスト対策ポータル
    </h1>

    <p>
      ログインしてください
    </p>


    <label for="email">
      メールアドレス
    </label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="メールアドレス"
    >


    <label for="password">
      パスワード
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="パスワード"
    >


    <button
      type="button"
      class="login-submit"
      onclick="login()"
    >

      <span class="material-symbols-rounded">
        login
      </span>

      <span>
        ログイン
      </span>

    </button>


    <div class="separator">
      <span>または</span>
    </div>


    <button
      type="button"
      class="google-btn"
      onclick="googleLogin()"
    >

      <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google"
      >

      <span>
        Googleでログイン
      </span>

    </button>

  </div>

</div>


<script
  type="module"
  src="js/auth.js"
></script>

</body>

</html>
