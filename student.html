<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
生徒ポータル
</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body>


<div class="layout">



<!-- 左メニュー -->

<aside class="sidebar">


<div class="logo">

定期テスト対策ポータル

</div>




<nav>


<button onclick="showPage('home')">
ホーム
</button>


<button onclick="showPage('notice')">
お知らせ
</button>


<button onclick="showPage('message')">
連絡
</button>


<button onclick="showPage('documents')">
配布文書
</button>


<button onclick="showPage('calendar')">
カレンダー
</button>


<button onclick="showPage('scores')">
テスト成績
</button>


<button onclick="showPage('settings')">
各種設定
</button>


<hr>


<button onclick="logout()">
ログアウト
</button>



</nav>


</aside>







<!-- メイン -->

<main class="content">






<!-- ホーム -->

<section id="home">


<h1>
ホーム
</h1>



<div class="card">


<h3>
重要なお知らせ
</h3>


<div id="importantNotice">

</div>


</div>





<div class="card">


<h3>
最新のお知らせ
</h3>


<div id="latestNotice">

</div>


</div>


</section>









<!-- お知らせ -->

<section id="notice">


<h1>
お知らせ
</h1>


<div id="noticeList">

</div>


</section>









<!-- 連絡 -->

<section id="message">


<h1>
連絡
</h1>



<textarea
id="messageText"
placeholder="運営への連絡内容を入力してください">
</textarea>



<button onclick="sendMessage()">

送信

</button>




<h3>
送信履歴
</h3>



<div id="messageHistory">

</div>


</section>









<!-- 配布文書 -->

<section id="documents">


<h1>
配布文書
</h1>




<div id="documentList">

</div>



<div id="documentPagination">

</div>



</section>









<!-- カレンダー -->

<section id="calendar">


<h1>
カレンダー
</h1>



<div id="calendarArea">

</div>


</section>









<!-- テスト成績 -->

<section id="scores">


<h1>
テスト成績
</h1>




<label>
テスト名
</label>


<input
id="testName"
placeholder="例：2学期期末テスト">





<label>
教科
</label>


<input
id="subject"
placeholder="例：数学">





<label>
点数
</label>


<input
id="score"
type="number"
placeholder="点数">





<button onclick="sendScore()">

提出

</button>



</section>









<!-- 各種設定 -->

<section id="settings">


<h1>
各種設定
</h1>




<div class="card">


<div id="userInfo">

読み込み中...

</div>




<br>



<button onclick="changePassword()">

パスワード変更

</button>



</div>



</section>







</main>


</div>






<script type="module" src="js/auth.js"></script>

<script type="module" src="js/student.js"></script>

<script type="module" src="js/settings.js"></script>

<script type="module" src="js/calendar.js"></script>



<script>

// 初期表示

document.addEventListener(
"DOMContentLoaded",
()=>{

document.getElementById("home")
.style.display="block";

});

</script>



</body>

</html>
