<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>定期テスト対策ポータル</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="logo">
定期テスト対策ポータル
</div>


<nav>

<button onclick="showPage('home')">
ホーム
</button>

<button onclick="showPage('notice')">
お知らせ
</button>

<button onclick="showPage('message')">
連絡
</button>

<button onclick="showPage('documents')">
配布文書
</button>

<button onclick="showPage('calendar')">
カレンダー
</button>

<button onclick="showPage('scores')">
テスト成績
</button>

<button onclick="showPage('settings')">
各種設定
</button>

<hr>

<button onclick="logout()">
ログアウト
</button>

</nav>

</aside>



<main class="content">


<section id="home">

<h1>ホーム</h1>

<div class="card">
<h3>重要なお知らせ</h3>
<div id="importantNotice"></div>
</div>


<div class="card">
<h3>最新のお知らせ</h3>
<div id="latestNotice"></div>
</div>

</section>




<section id="notice" class="hidden">

<h1>お知らせ</h1>

<div id="noticeList"></div>

</section>




<section id="message" class="hidden">

<h1>連絡</h1>

<textarea id="messageText"
placeholder="運営への連絡"></textarea>

<button onclick="sendMessage()">
送信
</button>

</section>




<section id="documents" class="hidden">

<h1>配布文書</h1>

<div id="documentList"></div>


<div class="pagination">

<button>1</button>
<button>2</button>
<button>3</button>
<button>次へ</button>

</div>

</section>





<section id="calendar" class="hidden">

<h1>カレンダー</h1>

<div id="calendarArea"></div>

</section>





<section id="scores" class="hidden">

<h1>テスト成績</h1>


<input id="testName"
placeholder="テスト名">


<input id="subject"
placeholder="教科">


<input id="score"
type="number"
placeholder="点数">


<button onclick="sendScore()">
送信
</button>


</section>





<section id="settings" class="hidden">

<h1>各種設定</h1>


<div class="card">

<p id="userInfo"></p>


<button onclick="changePassword()">
パスワード変更
</button>


</div>

</section>


</main>

</div>


<script type="module" src="js/student.js"></script>

<script type="module" src="js/settings.js"></script>


</body>

</html>
