<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>定期テスト対策ポータル</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="logo">
定期テスト対策ポータル
</div>

<nav>

<button onclick="showPage('home')">
ホーム
</button>

<button onclick="showPage('notice')">
お知らせ
</button>

<button onclick="showPage('message')">
連絡
</button>

<button onclick="showPage('documents')">
配布文書
</button>

<button onclick="showPage('calendar')">
カレンダー
</button>

<button onclick="showPage('scores')">
テスト成績
</button>

<button onclick="showPage('settings')">
各種設定
</button>

<hr>

<button onclick="logout()">
ログアウト
</button>

</nav>

</aside>


<main class="content">

<section id="home">

<h1>ホーム</h1>

<div class="card">

<h2>お知らせ</h2>

<div id="dashboardNotices">
読み込み中...
</div>

</div>

</section>


<section id="notice" style="display:none">

<h1>お知らせ</h1>

<div id="noticeList">
読み込み中...
</div>

</section>


<section id="message" style="display:none">

<h1>連絡</h1>

<div class="card">

<textarea
id="messageText"
placeholder="運営への連絡内容"></textarea>

<button onclick="sendMessage()">
送信
</button>

</div>

</section>


<section id="documents" style="display:none">

<h1>配布文書</h1>

<div id="documentList">
読み込み中...
</div>

</section>


<section id="calendar" style="display:none">

<h1>カレンダー</h1>

<div id="calendarArea">
読み込み中...
</div>

</section>


<section id="scores" style="display:none">

<h1>テスト成績</h1>

<div id="scoreFormList">
読み込み中...
</div>

</section>


<section id="settings" style="display:none">

<h1>各種設定</h1>

<div class="card">

<div id="userInfo"></div>

<button onclick="changePassword()">
パスワード変更
</button>

</div>

</section>

</main>

</div>


<script type="module" src="js/auth.js"></script>
<script type="module" src="js/student.js"></script>
<script type="module" src="js/settings.js"></script>

</body>
</html>
